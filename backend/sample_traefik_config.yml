http:
  middlewares:
    ipallow:
      ipAllowList:
        sourceRange:
          - "192.168.178.0/24" # FritzBox-LAN
          - "172.26.0.5" # Wireguard Container
    crowdsec-bouncer:
      forwardauth:
        address: http://192.168.178.56:3080/api/v1/forwardAuth
        trustForwardHeader: true
  
  serversTransports:
    insecureTransport:
      insecureSkipVerify: true

  services:
    cockpit_pi4:
      loadBalancer:
        servers:
          - url: http://192.168.178.56:9090

    plex:
      loadBalancer:
        servers:
          - url: http://192.168.178.24:32400
    
    nextcloud:
      loadBalancer:
