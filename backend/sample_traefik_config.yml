    truenas:
      loadBalancer:
        servers:
          - url: http://192.168.178.24:8080

    truenas_portainer:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: https://192.168.178.24:31015

    files:
      loadBalancer:
        serversTransport: insecureTransport
        servers:
          - url: https://192.168.178.24:30044

    tautulli:
      loadBalancer:
        servers:
          - url: http://192.168.178.24:30047

    minio:
      loadBalancer:
