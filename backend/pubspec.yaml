name: traefik_frontend_api
description: RESTful API for the flutter treafik-ui written in dart
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_swagger_ui: ^2.0.0
  shelf_open_api: ^3.0.0
  dotenv: ^4.2.0
  get_it: ^8.2.0
  yaml: ^3.1.3
  json_annotation: ^4.9.0

  # Local package dependencies
  traefik_frontend_shared:
    path: ../shared
  shelf_router_generator: ^1.1.2
  shelf_cors_headers: ^0.1.5
  uuid: ^4.5.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  build_runner: ^2.4.0
  shelf_open_api_generator: ^3.1.1
  json_serializable: ^6.11.1
